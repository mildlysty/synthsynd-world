<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" role="img" aria-labelledby="title desc">
  <title id="title">Synthsynd World</title>
  <desc id="desc">A high-contrast swarm emblem with a large, readable Synthsynd wordmark and prominent WORLD label.</desc>
  <defs>
    <linearGradient id="orbit" x1="8" y1="7" x2="104" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50F2E2"/><stop offset=".55" stop-color="#7B8FFF"/><stop offset="1" stop-color="#D765F2"/>
    </linearGradient>
    <linearGradient id="gem" x1="34" y1="25" x2="83" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4FFFC"/><stop offset=".52" stop-color="#9D9AFF"/><stop offset="1" stop-color="#E47AF2"/>
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="24" x2="482" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63EEE5"/><stop offset="1" stop-color="#C49BFF"/>
    </linearGradient>
    <radialGradient id="aura"><stop stop-color="#7566FF" stop-opacity=".34"/><stop offset="1" stop-color="#7566FF" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Swarm core -->
  <circle cx="56" cy="60" r="55" fill="url(#aura)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="56" cy="57" rx="44" ry="18" transform="rotate(-32 56 57)" stroke="#5DEBE3" stroke-opacity=".82" stroke-width="2.5"/>
    <ellipse cx="56" cy="57" rx="38" ry="15" transform="rotate(48 56 57)" stroke="#A18EFF" stroke-opacity=".88" stroke-width="2.2"/>
    <path d="M14 82c15-4 23-15 35-22 15-8 27-7 43-27" stroke="#D77CEF" stroke-opacity=".8" stroke-width="2.2"/>
  </g>
  <path d="m56 25 25 15v29L56 84 31 69V40Z" fill="url(#gem)" opacity=".32" filter="url(#glow)"/>
  <path d="m56 29 22 13v27L56 82 34 69V42Z" fill="#10131D" stroke="url(#orbit)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="m56 36 15 9v21L56 75 41 66V45Z" fill="url(#gem)" stroke="#F4FFFF" stroke-opacity=".88" stroke-width="1.3"/>
  <path d="M56 36v39M41 45l30 21M71 45 41 66" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.5"/>
  <g stroke="#090B10" stroke-width="2.5">
    <circle cx="18" cy="35" r="5.5" fill="#50F2E2"/><circle cx="94" cy="28" r="5.5" fill="#A58AFF"/>
    <circle cx="91" cy="83" r="5.5" fill="#E06FEA"/><circle cx="26" cy="92" r="4.5" fill="#EAFBFF"/>
  </g>

  <!-- High contrast wordmark -->
  <text x="128" y="67" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.7">
    <tspan fill="#FFFFFF">Synth</tspan><tspan fill="url(#accent)">synd</tspan>
  </text>
  <rect x="131" y="84" width="4" height="20" rx="2" fill="url(#orbit)"/>
  <text x="148" y="101" fill="#E8ECF7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="5.8">WORLD</text>
</svg>

